<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="120" height="120">
  <defs>
    <!-- Gradient for Primary Shapes -->
    <linearGradient id="iconPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    
    <!-- Gradient for Accent/Tech Element -->
    <linearGradient id="iconAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <!-- Background Canvas Circle (Optional for App Icons) -->
  <rect width="100" height="100" rx="22" fill="#F8FAFC" />

  <!-- Digital Book Base / Upward Chevron -->
  <path d="M 22 62 L 50 48 L 78 62 L 78 70 L 50 56 L 22 70 Z" fill="url(#iconPrimaryGrad)" />
  <path d="M 22 48 L 50 34 L 78 48 L 78 56 L 50 42 L 22 56 Z" fill="url(#iconAccentGrad)" />

  <!-- Graduation Cap Top / Diamond Node -->
  <polygon points="50,20 74,32 50,44 26,32" fill="url(#iconPrimaryGrad)" />
  
  <!-- Digital Pulse Points / Circuit Nodes -->
  <circle cx="50" cy="20" r="3.5" fill="#06B6D4" />
  <circle cx="74" cy="32" r="3" fill="#2563EB" />
  <circle cx="26" cy="32" r="3" fill="#2563EB" />
  <circle cx="50" cy="44" r="3.5" fill="#1D4ED8" />
</svg>
