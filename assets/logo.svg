<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="120">
  <defs>
    <!-- Gradients -->
    <linearGradient id="brandPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    
    <linearGradient id="brandAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- LOGO ICON (Left) -->
  <g transform="translate(10, 10)" filter="url(#softShadow)">
    <!-- App Container Background -->
    <rect width="100" height="100" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Digital Book / Growth Layers -->
    <path d="M 22 62 L 50 48 L 78 62 L 78 70 L 50 56 L 22 70 Z" fill="url(#brandPrimary)" />
    <path d="M 22 48 L 50 34 L 78 48 L 78 56 L 50 42 L 22 56 Z" fill="url(#brandAccent)" />

    <!-- Digital Mortarboard / Cap -->
    <polygon points="50,20 74,32 50,44 26,32" fill="url(#brandPrimary)" />

    <!-- Interactive Nodes -->
    <circle cx="50" cy="20" r="3.5" fill="#06B6D4" />
    <circle cx="74" cy="32" r="3" fill="#2563EB" />
    <circle cx="26" cy="32" r="3" fill="#2563EB" />
    <circle cx="50" cy="44" r="3.5" fill="#1D4ED8" />
  </g>

  <!-- BRAND TEXT & SLOGAN (Right) -->
  <g transform="translate(135, 0)">
    <!-- Brand Title -->
    <text x="0" y="58" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="38" fill="#0F172A" letter-spacing="-0.5">
      Digital<tspan fill="url(#brandPrimary)">LMS</tspan><tspan fill="#06B6D4">.</tspan>
    </text>


    <!-- Slogan -->
    <text x="0" y="84" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="14" fill="#64748B" letter-spacing="0.8">
      EMPOWERING FUTURE MINDS
    </text>
  </g>
</svg>
